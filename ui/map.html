<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>Survey map · Signal Atlas</title>
<link rel="stylesheet" href="/app/vendor/maplibre/maplibre-gl.css"><link rel="stylesheet" href="/app/vendor/leaflet/leaflet.css"><link rel="stylesheet" href="/app/map/map.css">
</head><body>
<header><nav><a href="/">← Home</a><strong>Survey map</strong><a href="/atlas/">Imports &amp; analysis</a><a href="/compare.html">Compare</a><a href="/database">Drive database</a></nav>
<div id="summary" aria-label="Whole survey counts"><span><b id="located">—</b> located SSIDs</span><span><b id="observed">—</b> observed SSIDs</span><span><b id="stored">—</b> stored observations</span></div></header>
<section class="toolbar" aria-label="Map filters">
<label>SSID <input id="ssid" type="search" placeholder="contains…"></label>
<label>Band <select id="band"><option value="">All</option><option>2.4</option><option>5</option><option>6</option><option value="unknown">Unknown</option><option value="other">Other</option><option value="none">None</option></select></label>
<label>Min signal <input id="minRssi" type="number" value="-150" min="-200" max="0" step="5"> dBm</label>
<label>From <input id="dateFrom" type="date"></label><label>To <input id="dateTo" type="date"></label>
<button id="dateScope" hidden></button>
<label>Estimates <select id="model"><option value="shared">Shared APs</option><option value="individual">Individual radios</option><option value="both">Both</option></select></label>
<button id="fitAll">Fit every AP</button><button id="cancelJob" hidden>Cancel fitting</button><span id="job" role="status"></span>
</section>
<section class="toolbar" aria-label="Map display">
<label><input id="showFits" type="checkbox" checked> APs</label><label><input id="clustering" type="checkbox" checked> Cluster nearby APs</label>
<label>AP labels <select id="labelZoom"></select></label><span id="zoom" class="muted"></span>
<label><input id="rings" type="checkbox" checked> Planning rings</label><label>Radius <input id="radius" type="number" min="5" max="50" step="1" value="10"> m</label>
<label>Map <select id="basemap"><option value="street">Street</option><option value="dark">Dark street</option></select></label>
<button id="fitBounds">Fit survey</button><button id="browse">Browse APs</button><button id="clearPins" hidden>Clear pins</button>
<span id="preferences" class="muted" role="status"></span><button id="retryPrefs" hidden>Retry save</button>
<details><summary>Sightings</summary><div class="obs-options"><label><input id="showObs" type="checkbox"> Show sightings</label><label>Point limit <select id="max"><option value="500000">0.5 M</option><option value="2000000" selected>2 M</option><option value="5000000">5 M</option><option value="8000000">8 M</option></select></label></div></details>
</section>
<main id="stage"><div id="map" aria-label="Survey map"></div><div id="status" role="status">loading…</div>
<aside id="details" hidden aria-label="Access point details"><button id="closeDetails" aria-label="Close details">×</button><div id="detailBody"></div></aside>
<div id="legend">● Individual AP &nbsp; <span class="cluster-key">12</span> nearby APs<br><small>Planning radius is not a confidence interval.</small><div id="fallback" hidden>Canvas map · WebGL unavailable</div></div></main>
<script src="/app/vendor/maplibre/maplibre-gl.js"></script><script src="/app/vendor/deck/deck.gl.js"></script><script src="/app/vendor/leaflet/leaflet.js"></script>
<script src="/app/map/display.js"></script><script src="/app/map/map.js"></script>
</body></html>
